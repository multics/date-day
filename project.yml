name: DateDay
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 26.0
targets:
  DateDay:
    type: application
    platform: macOS
    sources:
      - path: DateDay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yongtian.DateDay
        PRODUCT_NAME: DateDay
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Date Day
        INFOPLIST_KEY_LSUIElement: YES
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
  DateDayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DateDayTests
      - path: DateDay/DateDayFormatter.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yongtian.DateDayTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DateDay:
    build:
      targets:
        DateDay: all
        DateDayTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DateDayTests
